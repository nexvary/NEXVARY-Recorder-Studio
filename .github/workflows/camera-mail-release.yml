name: Camera Mail Release Acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camera-mail-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
          cache-read-only: false
      - run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      # DEBUG=false, signed with the public fixture key ONLY for instrumentation.
      # Never use this APK for owner delivery; normal workflow produces the unsigned owner AAB.
      - run: gradle --no-daemon -PguardianMailReleaseTest=true :app:assembleRelease :app:assembleReleaseAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: Nexus 5X
          ram-size: 3072M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front none
          script: bash scripts/camera_mail_release_gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-camera-mail-release-acceptance
          path: |
            mail-screenshots/
            mail-diagnostics/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/connected/
