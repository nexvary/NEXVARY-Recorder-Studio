name: Continuous Emergency 15 Minute Acceptance
on:
  push:
    branches: [feature/continuous-emergency-recording]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: continuous-long-${{ github.ref }}
  cancel-in-progress: true
jobs:
  camera-fifteen-minutes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: Nexus 5X
          ram-size: 3072M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front none
          script: bash scripts/continuous_gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-fifteen-minute-evidence
          path: |
            continuous-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/connected/
