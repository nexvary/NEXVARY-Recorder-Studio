name: Android Release Gate
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  GUARDIAN_PUBLIC_API_URL: ${{ vars.GUARDIAN_PUBLIC_API_URL }}
permissions:
  contents: read
concurrency:
  group: android-release-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements-dev.txt cfn-lint
      - run: python -m ruff check backend/src backend/tests --select E9,F63,F7,F82
      - run: python -m pytest -q backend/tests
      - run: cfn-lint backend/template.yaml
  portable-backend-test:
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: guardian-ci-only
          MYSQL_DATABASE: guardian_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -pguardian-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GUARDIAN_TESTING: '1'
      GUARDIAN_DB_ENGINE: ${{ matrix.database }}
      GUARDIAN_DB_NAME: guardian_ci
      GUARDIAN_DB_USER: root
      GUARDIAN_DB_PASSWORD: guardian-ci-only
      GUARDIAN_DB_HOST: 127.0.0.1
      GUARDIAN_DB_PORT: '3306'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/portable/requirements-dev.txt mysqlclient
      - run: python -m ruff check backend/src backend/portable --select E9,F63,F7,F82
      - run: python backend/portable/manage.py check
      - run: python backend/portable/manage.py makemigrations --check --dry-run
      - run: python -m pytest -q -c backend/portable/pytest.ini backend/portable/tests --junitxml=portable-results.xml
      - name: Verify deployable cPanel bundle
        run: python scripts/package_hosted_backend.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-portable-backend-${{ matrix.database }}
          path: |
            portable-results.xml
            dist/NEXVARY-Guardian-Hosted-Backend-0.11.0.zip
  build-and-static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: UI Release Gate
        run: |
          python3 scripts/verify_npse_dependency.py
          python3 scripts/ui_release_gate.py
          python3 scripts/app_review_gate.py
      - name: Install Android SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
          cache-read-only: false
      - name: Lint, unit tests, build and compile instrumentation
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease
      - name: Verify APK and pinned preview certificate
        run: |
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee app/build/reports/apk-signature.txt
          expected=$(keytool -exportcert -keystore .github/preview-debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          grep -F "Signer #1 certificate SHA-256 digest: $expected" app/build/reports/apk-signature.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Guardian-Studio-v0.12.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      # Owner delivery uses the release-signing workflow documented in docs/SIGNED_DELIVERY.md.
      # The public debug certificate is for automated tests, never a release update.
      - name: Upload unsigned release candidate AAB
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Guardian-Studio-v0.12.2-unsigned-rc-aab
          path: app/build/outputs/bundle/release/*.aab
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: app/build/reports/
  emulator-ui-smoke:
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35]
    needs: build-and-static-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
          cache-read-only: false
      - name: Install compile SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile app and test APKs before booting emulator
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Stable emulator navigation and actual Arabic screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: Nexus 5X
          ram-size: 3072M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front none
          script: bash scripts/emulator_gate.sh
      - name: Upload verified real screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-real-screenshots-${{ matrix.api }}
          path: screenshots/*.png
          if-no-files-found: error
      - name: Upload emulator diagnostics and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics-${{ matrix.api }}
          path: |
            diagnostics/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/connected/
  publish-preview:
    if: false # Hold publishing during the family safety implementation and review
    needs: [build-and-static-gate, emulator-ui-smoke, backend-test, portable-backend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NEXVARY-Guardian-Studio-v0.12.2-debug
          path: preview-download/
      - uses: actions/download-artifact@v4
        with:
          name: android-emulator-real-screenshots-35
          path: preview-screenshots/
      - uses: actions/download-artifact@v4
        with:
          name: NEXVARY-Guardian-Studio-v0.12.2-unsigned-rc-aab
          path: preview-download/
      - name: Publish quality-gated installable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv preview-download/app-debug.apk preview-download/NEXVARY-Guardian-Studio-v0.12.2-debug.apk
          sha256sum preview-download/*.apk > preview-download/SHA256SUMS.txt
          gh release create "recorder-ui-0.9.0-${GITHUB_RUN_NUMBER}" preview-download/* preview-screenshots/*.png --target "$GITHUB_SHA" --prerelease --title "NEXVARY Recorder Studio 0.9.0 — Child & Family Safety preview" --notes-file docs/release-notes-0.9.0.md
