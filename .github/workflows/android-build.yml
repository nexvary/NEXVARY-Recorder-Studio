name: Android Release Gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: UI Release Gate
        run: python3 scripts/ui_release_gate.py
      - name: Install Android SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
          cache-read-only: false
      - name: Lint, unit tests, build and compile instrumentation
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease
      - name: Verify APK and pinned preview certificate
        run: |
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee app/build/reports/apk-signature.txt
          expected=$(keytool -exportcert -keystore .github/preview-debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          grep -F "Signer #1 certificate SHA-256 digest: $expected" app/build/reports/apk-signature.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Recorder-Studio-v0.9.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned release candidate AAB
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Recorder-Studio-v0.9.0-unsigned-rc-aab
          path: app/build/outputs/bundle/release/*.aab
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: app/build/reports/
  emulator-ui-smoke:
    needs: build-and-static-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
          cache-read-only: false
      - name: Install compile SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile app and test APKs before booting emulator
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Stable emulator navigation and actual Arabic screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: Nexus 5X
          ram-size: 3072M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front none
          script: bash scripts/emulator_gate.sh
      - name: Upload verified real screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-real-screenshots
          path: screenshots/*.png
          if-no-files-found: error
      - name: Upload emulator diagnostics and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            diagnostics/
            app/build/reports/androidTests/
  publish-preview:
    if: false # Hold publishing during the family safety implementation and review
    needs: [build-and-static-gate, emulator-ui-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NEXVARY-Recorder-Studio-v0.9.0-debug
          path: preview-download/
      - uses: actions/download-artifact@v4
        with:
          name: android-emulator-real-screenshots
          path: preview-screenshots/
      - name: Publish quality-gated installable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv preview-download/app-debug.apk preview-download/NEXVARY-Recorder-Studio-v0.9.0-debug.apk
          sha256sum preview-download/*.apk > preview-download/SHA256SUMS.txt
          gh release create "recorder-ui-0.9.0-${GITHUB_RUN_NUMBER}" preview-download/* preview-screenshots/*.png --target "$GITHUB_SHA" --prerelease --title "NEXVARY Recorder Studio 0.9.0 — UI preview" --notes-file docs/release-notes-0.9.0.md
