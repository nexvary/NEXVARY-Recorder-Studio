name: Owner Signing Public Tools
on:
  push:
    branches: [build/owner-signing-tools]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-public-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned public bundletool and prepare SDK tools
        run: |
          mkdir -p signing-public-tools
          curl -fL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o signing-public-tools/bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  signing-public-tools/bundletool.jar' | sha256sum -c -
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0"
          cp /usr/local/lib/android/sdk/build-tools/36.0.0/lib/apksigner.jar signing-public-tools/
          cp /usr/local/lib/android/sdk/build-tools/36.0.0/aapt2 signing-public-tools/
          python -m pip download --no-deps pyzipper==0.3.6 -d signing-public-tools
          sha256sum signing-public-tools/* > signing-public-tools/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: guardian-public-owner-signing-tools
          path: signing-public-tools/
          retention-days: 7
